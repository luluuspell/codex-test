name: native-core-tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q liandanlu_native
      - run: pytest -W error --cov=liandanlu_native --cov-report=term-missing --cov-fail-under=75

  swift_bridge:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: swift --version
      - run: swift build -c release --package-path desktop_bridge_swift
      - id: bridge-bin
        shell: bash
        run: echo "path=$(swift build -c release --package-path desktop_bridge_swift --show-bin-path)/LiandanluDesktopBridge" >> "$GITHUB_OUTPUT"
      - run: test -x "${{ steps.bridge-bin.outputs.path }}"
      - run: python -m pip install -e '.[test]'
      - name: Real Swift Bridge integration
        env:
          LIANDANLU_SWIFT_BRIDGE_BIN: ${{ steps.bridge-bin.outputs.path }}
        run: pytest -W error -q tests/test_swift_bridge_integration.py
