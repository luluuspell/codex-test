name: native-core-tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q liandanlu_native scripts
      - run: pytest -W error --cov=liandanlu_native --cov-report=term-missing --cov-report=json:verification/coverage.json --cov-fail-under=75 --junitxml=verification/junit.xml
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_attempt }}
          path: verification/
          retention-days: 30

  package:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - name: Read source version
        id: version
        run: python -c 'import os,tomllib; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; open(os.environ["GITHUB_OUTPUT"],"a").write("value="+v+"\n")'
      - name: Bounded verification groups and real crash smoke
        run: python scripts/verify_groups.py
      - name: Build, hash-check, unpack and re-test full Native Core source
        run: python scripts/package_source.py
      - name: Upload verified source bundle
        uses: actions/upload-artifact@v4
        with:
          name: Liandanlu-Native-Core-${{ steps.version.outputs.value }}-Full-Source-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve grouped diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grouped-verification-${{ github.run_attempt }}
          path: verification/
          retention-days: 30
